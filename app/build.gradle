plugins { id 'com.android.application' }

android {
    namespace 'io.github.hfchtinm.regblock'
    compileSdk 36

    defaultConfig {
        applicationId "io.github.hfchtinm.regblock"
        minSdk 29
        targetSdk 36
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        ownKey {
            storeFile rootProject.file('keys/urm-release.jks')
            storePassword 'UrmRegBlock2026'
            keyAlias 'urmreg'
            keyPassword 'UrmRegBlock2026'
        }
        debugSign {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.ownKey
        }
        debugSignRelease {
            initWith release
            signingConfig signingConfigs.debugSign
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }
}

dependencies { compileOnly files('xposed-stubs.jar') }